    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.3
  path_provider: ^2.1.6
  http: ^1.6.0
  intl: ^0.20.2
  mobile_scanner: ^7.2.0
  qr_scanner_overlay: ^0.0.2

dev_dependencies:
